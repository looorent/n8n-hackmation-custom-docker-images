# Keep stdout clean: it must contain only the Base64 payload.
quarkus.banner.enabled=false
quarkus.log.console.stderr=true
quarkus.log.level=WARN

# Native image is built inside a container, so no local GraalVM is required.
quarkus.native.container-build=true
# UPX-compress the executable (~37MB -> ~13MB). Costs ~100-300ms at startup,
# acceptable for a one-shot CLI.
quarkus.native.compression.level=5

quarkus.container-image.group=looorent
quarkus.container-image.name=hackmation-java-qr-code-cli
quarkus.container-image.tag=latest
