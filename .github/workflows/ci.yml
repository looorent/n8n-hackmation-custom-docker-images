name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NAMESPACE: looorent

jobs:
  docker-images:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - hackmation-rust-brainfuck-cli
          - hackmation-go-ascii-art-cli
          - hackmation-lisette-base64-to-image-cli
    steps:
      - uses: actions/checkout@v4

      - name: Run tests (Docker test stage)
        run: docker build --target test ${{ matrix.project }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.project }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.NAMESPACE }}/${{ matrix.project }}:latest

  java-image:
    name: hackmation-java-qr-code-cli
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hackmation-java-qr-code-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests (JVM)
        run: ./gradlew test

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Native compilation runs in the Mandrel builder container (no GraalVM
      # on the runner). amd64 only: native-image under QEMU is impractical.
      - name: Build native image (and push on main)
        run: >
          ./gradlew build
          -Dquarkus.native.enabled=true
          -Dquarkus.package.jar.enabled=false
          -Dquarkus.container-image.build=true
          ${{ github.event_name == 'push' && '-Dquarkus.container-image.push=true' || '' }}

      - name: Smoke test
        run: |
          docker run --rm "$NAMESPACE/hackmation-java-qr-code-cli:latest" "ci smoke" | base64 -d | head -c 8 | od -An -tx1 | grep -q '89 50 4e 47'
